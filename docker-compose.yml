services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: nydra-backend
    env_file: .env.docker
    volumes:
      - nydra-data:/data
    restart: always

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: nydra-frontend
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  nydra-data:
  caddy-data:
